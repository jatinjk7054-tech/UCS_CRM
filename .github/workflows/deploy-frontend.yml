name: Deploy Frontend (client)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'client/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 'client/package-lock.json'

      # Build and verification live in ONE step on purpose. A step's `env:` block
      # is scoped to that step only, so a separate verify step would read
      # variables that are not set there and fail every deploy.
      - name: Build and verify no chat mock is present
        env:
          VITE_API_URL: https://api.beingsevak.org/api
          VITE_SOCKET_URL: https://api.beingsevak.org
          VITE_WHATSAPP_MASTER_EMAIL: ${{ secrets.CRM_WHATSAPP_EMAIL }}
          VITE_WHATSAPP_MASTER_PASSWORD: ${{ secrets.CRM_WHATSAPP_PASSWORD }}
        run: |
          cd client

          # The in-memory chat mock is gone for good. It reached production
          # twice - once because VITE_CHAT_MOCK was read as `!== 'false'` so an
          # absent variable meant ON, and once because a "clean" check grepped
          # the bundle for a string the mock never contained. Fail loudly if
          # anything tries to bring it back.
          if [ -f src/components/chat/chatMock.js ]; then
            echo "::error::src/components/chat/chatMock.js exists - the mock is removed for good"
            exit 1
          fi
          if grep -rqE "chatMock|CHAT_MOCK|VITE_CHAT_MOCK" src 2>/dev/null; then
            echo "::error::a source file still references the chat mock"
            grep -rnE "chatMock|CHAT_MOCK|VITE_CHAT_MOCK" src | head -20
            exit 1
          fi

          npm ci
          npm run build

          # Sound now, and only now: with the module deleted, its fixture text
          # cannot reach the bundle unless something imports it again. The same
          # grep was meaningless before the deletion precisely because the mock
          # was statically imported and present either way.
          if grep -rq "Priya Nair" dist/assets 2>/dev/null; then
            echo "::error::chat mock fixtures found in dist - refusing to deploy"
            exit 1
          fi
          echo "no chat mock in src or dist: Community reads the real database"

      - name: Clear old entry point (keep hashed assets for open tabs)
        uses: appleboy/ssh-action@v1
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo -n chown -R ec2-user:ec2-user /var/www/crm 2>/dev/null || true
            # NOTE: never rm -rf assets/ — hashed chunk filenames change every
            # build, and open tabs still request the previous deploy's chunks
            # ("Failed to fetch dynamically imported module"). Overwriting adds
            # the new files alongside the old ones; only prune files untouched
            # for 7+ days to bound disk growth.
            rm -f /var/www/crm/index.html || true
            find /var/www/crm/assets /var/www/crm/logo /var/www/crm/receipt-assets -type f -mtime +7 -delete 2>/dev/null || true

      - name: Deploy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 13.207.47.116
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "client/dist/*"
          target: /var/www/crm
          strip_components: 2

      - name: Verify Frontend
        run: |
          STATUS=$(curl -sf "https://crm.beingsevak.org" -o /dev/null -w "%{http_code}" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Frontend is live (HTTP $STATUS)"
          else
            echo "Warning: Frontend returned HTTP $STATUS"
          fi
