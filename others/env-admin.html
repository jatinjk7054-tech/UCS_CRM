<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Env &amp; Server Admin</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --panel2: #1d2638;
    --border: #2a3650;
    --text: #dbe3f0;
    --muted: #8a96ad;
    --accent: #4f8cff;
    --accent2: #38d39f;
    --danger: #ff5c5c;
    --warn: #ffb648;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); display: inline-block; margin-right: 6px; }
  .dot.ok { background: var(--accent2); }
  .dot.err { background: var(--danger); }
  .spacer { flex: 1; }
  button {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  button.danger:hover { background: rgba(255,92,92,.12); }
  main { padding: 24px; max-width: 1280px; margin: 0 auto; }
  section { margin-bottom: 28px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .card .value { font-size: 24px; font-weight: 600; margin-top: 6px; }
  .card .value.small { font-size: 16px; }
  .bar { height: 6px; background: var(--panel2); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .bar > div.warn { background: var(--warn); }
  .bar > div.danger { background: var(--danger); }
  /* Read/write split: two segments sharing one track, so the ratio is visible
     without inventing a fixed "max" for two rates that have no natural ceiling. */
  .split { height: 10px; background: var(--panel2); border-radius: 5px; margin-top: 10px; overflow: hidden; display: flex; }
  .split > div { height: 100%; transition: width .3s ease; }
  .split > div.reads { background: var(--accent); }
  .split > div.writes { background: var(--accent2); }
  .splitLegend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .splitLegend .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .project {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .project .name { font-weight: 600; font-size: 15px; word-break: break-all; }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.yes { border-color: var(--accent2); color: var(--accent2); }
  .badge.warn { border-color: var(--warn); color: var(--warn); }
  .banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 14px;
    font-size: 13px;
    background: rgba(255,182,72,.08);
    border: 1px solid var(--warn);
    color: var(--warn);
  }
  .banner button { margin-left: auto; padding: 5px 10px; }
  .menuWrap { position: relative; }
  .menu {
    position: absolute;
    right: 0;
    top: 100%;
    margin-top: 6px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    min-width: 180px;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .menu button { display: block; width: 100%; text-align: left; border: none; background: transparent; padding: 8px 10px; border-radius: 7px; }
  .menu button:hover { background: rgba(79,140,255,.12); }
  .project .meta { font-size: 12px; color: var(--muted); }
  .project .row { display: flex; align-items: center; gap: 8px; }
  .project .row .spacer { flex: 1; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; font-size: 13px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }
  .status-online { color: var(--accent2); }
  .status-errored, .status-stopped { color: var(--danger); }
  .muted { color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

  dialog {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: min(760px, 94vw);
    max-height: 88vh;
    padding: 0;
  }
  dialog::backdrop { background: rgba(4,8,16,.65); }
  .dlg-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .dlg-head h3 { margin: 0; font-size: 16px; }
  .dlg-head .path { font-size: 12px; color: var(--muted); font-family: Consolas, monospace; }
  .dlg-body { padding: 16px 18px; overflow: auto; max-height: 70vh; }
  form.add {
    display: grid;
    grid-template-columns: 220px 1fr auto;
    gap: 10px;
    align-items: center;
    margin-bottom: 18px;
    padding: 14px;
    background: var(--panel2);
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
  input, textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: Consolas, monospace;
    width: 100%;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .vrow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 6px;
    border-bottom: 1px solid var(--border);
  }
  .vrow:last-child { border-bottom: none; }
  .vrow .key { font-weight: 600; min-width: 180px; word-break: break-all; }
  .vrow .val {
    flex: 1;
    color: var(--muted);
    font-family: Consolas, monospace;
    font-size: 12.5px;
    word-break: break-all;
    white-space: pre-wrap;
  }
  .vrow .actions { display: flex; gap: 6px; }
  .vrow button { padding: 5px 9px; font-size: 12px; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--panel2);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 100;
    max-width: 360px;
    opacity: 0;
    transform: translateY(8px);
    transition: .2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast.ok { border-color: var(--accent2); }
  .toast.err { border-color: var(--danger); }
  @media (max-width: 640px) {
    form.add { grid-template-columns: 1fr; }
    .vrow { flex-wrap: wrap; }
    .vrow .key { min-width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Env &amp; Server Admin</h1>
  <span class="sub"><span class="dot" id="statusDot"></span><span id="statusText">connecting…</span></span>
  <div class="spacer"></div>
  <button id="tokenBtn">Token</button>
  <button id="restartBtn" class="danger">Restart backend</button>
  <button id="viewAllBtn">View All</button>
  <button id="refreshBtn">Refresh</button>
</header>

<main>
  <section>
    <h2>Server Load</h2>
    <div class="cards" id="sysCards"></div>
    <div id="pm2Wrap" style="margin-top:14px"></div>
  </section>

  <section>
    <h2>Live Queries</h2>
    <div id="queryWrap"></div>
  </section>

  <section>
    <h2>Connections</h2>
    <div id="clientWrap"></div>
  </section>

  <section>
    <h2>Database</h2>
    <div class="cards" id="dbCards"></div>
    <div id="dbSplit" style="margin-top:14px"></div>
    <div id="dbWrap" style="margin-top:14px"></div>
    <p class="hint" id="dbHint"></p>
  </section>

  <section id="projectsSection">
    <h2>Projects</h2>
    <div class="grid" id="projectsGrid"></div>
  </section>

  <section id="allEnvSection" style="display:none">
    <div class="row" style="margin-bottom:14px">
      <h2 style="margin:0">All Env Files</h2>
      <div class="spacer"></div>
      <button id="downloadAllBtn">Download all .env</button>
    </div>
    <div id="allEnvList"></div>
  </section>
</main>

<dialog id="envDialog">
  <div class="dlg-head">
    <h3 id="dlgTitle">Project</h3>
    <span class="path" id="dlgPath"></span>
    <div class="spacer"></div>
    <div class="menuWrap">
      <button id="exportBtn">Export ▾</button>
      <div class="menu" id="exportMenu" style="display:none">
        <button data-export="env">Download .env file</button>
        <button data-export="json">Download JSON</button>
      </div>
    </div>
    <button id="dlgClose">Close</button>
  </div>
  <div class="dlg-body">
    <div id="deployBanner"></div>
    <form class="add" id="addForm">
      <input id="newKey" placeholder="KEY_NAME" autocomplete="off" spellcheck="false">
      <textarea id="newValue" rows="1" placeholder="value" autocomplete="off" spellcheck="false" style="resize:vertical; min-height:34px"></textarea>
      <button class="primary" id="addBtn" type="submit">Add / Update</button>
    </form>
    <div id="varsList"></div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<dialog id="dbDialog">
  <div class="dlg-head">
    <h3>Deadlocks</h3>
    <span class="path">Postgres lock contention</span>
    <div class="spacer"></div>
    <button id="dbDlgClose">Close</button>
  </div>
  <div class="dlg-body" id="dbDlgBody"></div>
</dialog>

<script>
(function () {
  'use strict';

  var API_BASE = 'https://api.beingsevak.org';
  try { API_BASE = (new URLSearchParams(location.search).get('api') || API_BASE).replace(/\/+$/, ''); } catch (e) {}

  var TOKEN = '';
  try { TOKEN = new URLSearchParams(location.search).get('token') || localStorage.getItem('envAdminToken') || ''; } catch (e) {}
  var currentProject = null;
  var currentVars = [];
  var lastSystem = null;
  var lastEnvData = null;
  var lastAllData = null;
  var allEnvActive = false;

  var $ = function (id) { return document.getElementById(id); };

  // ---- helpers ------------------------------------------------------------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtBytes(b) {
    b = Number(b) || 0;
    if (b >= 1e12) return (b / 1e12).toFixed(2) + ' TB';
    if (b >= 1e9) return (b / 1e9).toFixed(1) + ' GB';
    if (b >= 1e6) return (b / 1e6).toFixed(1) + ' MB';
    return (b / 1024).toFixed(0) + ' KB';
  }
  function fmtUptime(s) {
    s = Number(s) || 0;
    var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    if (d > 0) return d + 'd ' + h + 'h ' + m + 'm';
    if (h > 0) return h + 'h ' + m + 'm';
    return m + 'm ' + (s % 60) + 's';
  }
  function barClass(pct) {
    if (pct >= 90) return 'danger';
    if (pct >= 70) return 'warn';
    return '';
  }
  function toast(msg, type) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type || 'ok');
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.className = 'toast'; }, 2600);
  }
  function setStatus(text, cls) {
    $('statusText').textContent = text;
    $('statusDot').className = 'dot ' + (cls || '');
  }

  // ---- api ----------------------------------------------------------------
  function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    var url = API_BASE ? API_BASE + path : path;
    if (TOKEN) {
      url += (url.indexOf('?') === -1 ? '?' : '&') + 'key=' + encodeURIComponent(TOKEN);
    }
    return fetch(url, Object.assign({}, opts, { headers: headers })).then(function (r) {
      if (r.status === 401) {
        var t = prompt('Enter admin token:');
        if (t) {
          TOKEN = t.trim();
          try { localStorage.setItem('envAdminToken', TOKEN); } catch (e) {}
          return api(path, opts);
        }
        throw new Error('Unauthorized');
      }
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) throw new Error(data.message || ('HTTP ' + r.status));
        return data;
      });
    });
  }

  // ---- system -------------------------------------------------------------
  function card(label, value, opts) {
    opts = opts || {};
    var bar = opts.pct != null
      ? '<div class="bar"><div class="' + barClass(opts.pct) + '" style="width:' + Math.max(0, Math.min(100, opts.pct)) + '%"></div></div>'
      : '';
    return '<div class="card"><div class="label">' + esc(label) + '</div><div class="value' + (opts.small ? ' small' : '') + '">' + esc(value) + '</div>' + bar + '</div>';
  }

  function renderSystem(d) {
    var html = '';
    html += card('CPU', (d.cpu && d.cpu.usagePct != null) ? d.cpu.usagePct + '%' : 'n/a', { pct: (d.cpu && d.cpu.usagePct) || 0, small: true });
    html += card('Memory', d.mem.pct + '%', { pct: d.mem.pct, small: true });
    html += card('RAM Used', fmtBytes(d.mem.used) + ' / ' + fmtBytes(d.mem.total), { small: true });
    html += card('Host', d.hostname, { small: true });
    html += card('Uptime', fmtUptime(d.uptime_seconds), { small: true });
    html += card('Load Avg', (d.load_avg || []).join(' / '), { small: true });
    html += card('Node', d.node, { small: true });
    $('sysCards').innerHTML = html;

    var diskHtml = d.disk && d.disk.length
      ? d.disk.map(function (ds) {
          return '<div class="card"><div class="label">Disk — ' + esc(ds.mount) + '</div><div class="value small">' +
            esc(fmtBytes(ds.used) + ' / ' + fmtBytes(ds.total) + ' (' + ds.pct + '%)') + '</div>' +
            '<div class="bar"><div class="' + barClass(ds.pct) + '" style="width:' + Math.min(100, ds.pct) + '%"></div></div></div>';
        }).join('')
      : '';
    var pm2Html = '';
    if (d.pm2 && d.pm2.length) {
      pm2Html = '<table><thead><tr><th>Process</th><th>Status</th><th>Restarts</th><th>CPU</th><th>Memory</th><th>Uptime</th></tr></thead><tbody>' +
        d.pm2.map(function (p) {
          var cls = p.status === 'online' ? 'status-online' : (p.status === 'errored' || p.status === 'stopped' ? 'status-errored' : '');
          return '<tr><td class="mono">' + esc(p.name) + '</td>' +
            '<td class="' + cls + '">' + esc(p.status) + '</td>' +
            '<td>' + p.restart_time + '</td>' +
            '<td>' + p.cpu + '%</td>' +
            '<td>' + fmtBytes(p.memory) + '</td>' +
            '<td>' + fmtUptime(Math.round(p.uptime_ms / 1000)) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    $('pm2Wrap').innerHTML = diskHtml + pm2Html;
  }

  function loadSystem() {
    return api('/api/envadmin/system').then(function (d) {
      lastSystem = d;
      renderSystem(d);
      setStatus('connected — ' + d.hostname, 'ok');
      return d;
    }).catch(function (e) {
      setStatus(e.message, 'err');
      toast(e.message, 'err');
    });
  }

  // ---- database -----------------------------------------------------------
  function fmtNum(n) {
    if (n == null) return 'n/a';
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n);
  }

  function renderDb(d) {
    var s = d.per_sec;
    var writes = s.inserts + s.updates + s.deletes;
    var html = '';
    html += card('Reads / sec', fmtNum(s.reads), { small: true });
    html += card('Writes / sec', fmtNum(writes), { small: true });
    html += card('Commits / sec', fmtNum(s.commits), { small: true });
    // Under ~90% and queries are starting to hit disk instead of cache. Above 99%
    // is healthy and the bar is full, so it reads as "nothing to worry about".
    html += card('Cache Hit', d.cache_hit_pct != null ? d.cache_hit_pct + '%' : 'n/a',
      { pct: d.cache_hit_pct != null ? Math.min(100, d.cache_hit_pct) : 0, small: true });
    html += card('Total Writes', fmtNum(d.totals.inserts + d.totals.updates + d.totals.deletes), { small: true });
    html += '<div class="card" id="deadlockCard" title="Click for what caused these"><div class="label">Deadlocks</div>' +
      '<div class="value small">' + fmtNum(d.totals.deadlocks) + '</div>' +
      '<div class="bar"><div class="' + (d.totals.deadlocks > 0 ? 'danger' : '') +
      '" style="width:' + (d.totals.deadlocks > 0 ? 100 : 0) + '%"></div></div></div>';
    $('dbCards').innerHTML = html;

    // Reads and writes per second have no fixed ceiling, so a plain percentage
    // bar would need an invented "max". Instead they share one track and each
    // takes its true share of the pair -- the ratio is what is worth seeing, and
    // a read-heavy workload reads as mostly blue rather than a fake "40%".
    var total = s.reads + writes;
    var readPct = total > 0 ? (s.reads / total) * 100 : 0;
    var writePct = total > 0 ? (writes / total) * 100 : 0;
    $('dbSplit').innerHTML =
      '<div class="split">' +
        '<div class="reads" style="width:' + readPct + '%"></div>' +
        '<div class="writes" style="width:' + writePct + '%"></div>' +
      '</div>' +
      '<div class="splitLegend">' +
        '<span><span class="swatch" style="background:var(--accent)"></span>Reads ' + fmtNum(s.reads) + '/s (' + readPct.toFixed(0) + '%)</span>' +
        '<span><span class="swatch" style="background:var(--accent2)"></span>Writes ' + fmtNum(writes) + '/s (' + writePct.toFixed(0) + '%)</span>' +
      '</div>';

    $('deadlockCard').addEventListener('click', showDeadlocks);

    var tbl = '';
    if (d.tables && d.tables.length) {
      tbl += '<table><thead><tr><th>Table</th><th>Ins</th><th>Upd</th><th>Del</th><th>Seq Scans</th><th>Idx Scans</th><th>Live Rows</th><th>Dead Rows</th></tr></thead><tbody>' +
        d.tables.map(function (t) {
          return '<tr><td class="mono">' + esc(t.table) + '</td>' +
            '<td>' + fmtNum(t.n_tup_ins) + '</td>' +
            '<td>' + fmtNum(t.n_tup_upd) + '</td>' +
            '<td>' + fmtNum(t.n_tup_del) + '</td>' +
            '<td>' + fmtNum(t.seq_scan) + '</td>' +
            '<td>' + fmtNum(t.idx_scan) + '</td>' +
            '<td>' + fmtNum(t.n_live_tup) + '</td>' +
            '<td>' + fmtNum(t.n_dead_tup) + '</td></tr>';
        }).join('') + '</tbody></table>';
    } else {
      tbl = '<p class="muted">No table traffic recorded yet.</p>';
    }

    if (d.by_app && d.by_app.length) {
      tbl += '<table style="margin-top:14px"><thead><tr><th>Application</th><th>Client</th><th>Conns</th><th>Stuck</th><th>Waiting</th><th>Oldest Idle Tx</th></tr></thead><tbody>' +
        d.by_app.map(function (a) {
          return '<tr><td class="mono">' + esc(a.app) + '</td>' +
            '<td class="mono">' + esc(a.client) + '</td>' +
            '<td>' + a.conns + '</td>' +
            '<td>' + (a.stuck ? '<span style="color:var(--danger)">' + a.stuck + '</span>' : '0') + '</td>' +
            '<td>' + a.waiting + '</td>' +
            '<td>' + (a.oldest_idle_s != null ? Math.round(a.oldest_idle_s) + 's' : '—') + '</td></tr>';
        }).join('') + '</tbody></table>';
    }

    $('dbWrap').innerHTML = tbl;

    $('dbHint').textContent =
      'Reads/writes per second are sampled over a 1s window. Totals and the table ' +
      'breakdown are cumulative since the last Postgres stats reset, and they cover ' +
      'the whole database — on RDS that includes the production backend, not just local.';
  }

  // ---- deadlocks ----------------------------------------------------------
  // ---- live queries -------------------------------------------------------
  // The "site keeps loading on a fast network" symptom is almost always pool
  // saturation, not CPU or network. db.js caps the pool at 5, so the 5th
  // concurrent slow query makes every OTHER request in the app wait for a free
  // connection. Surfacing pool.busy against pool.app_max is the number that
  // explains it.
  function renderQueries(d) {
    var p = d.pool;
    var pct = Math.min(100, (p.busy / p.app_max) * 100);
    var cls = p.saturated ? 'danger' : (p.busy >= 3 ? 'warn' : '');
    var h = '<div class="cards">';
    h += '<div class="card"><div class="label">Pool In Use</div><div class="value small">' +
         p.busy + ' / ' + p.app_max + '</div><div class="bar"><div class="' + cls +
         '" style="width:' + pct + '%"></div></div></div>';
    var realActive = d.active.filter(function (a) { return !a.is_panel; });
    h += '<div class="card"><div class="label">Running Now</div><div class="value small">' +
         realActive.length + '</div></div>';
    h += '<div class="card"><div class="label">Blocked on Lock</div><div class="value small">' +
         realActive.filter(function (a) { return a.blocked; }).length + '</div></div>';
    var slowest = d.slow_history.length ? d.slow_history[0].max_s : 0;
    h += '<div class="card"><div class="label">Slowest Seen</div><div class="value small">' +
         (slowest ? slowest.toFixed(1) + 's' : 'none') + '</div></div>';
    h += '</div>';

    if (p.saturated) {
      h += '<p style="color:var(--warn);margin-top:12px"><strong>Pool saturated.</strong> Every ' +
           'request is queued behind these queries. This is what "the site keeps loading" looks ' +
           'like when the network is fine.</p>';
    }
    if (d.by_state) {
      h += '<p class="hint">Pool and lock counts exclude this panel\'s own polling, which would ' +
           'otherwise show up as load on the pool it is measuring.</p>';
    }

    if (realActive.length) {
      h += '<table style="margin-top:14px"><thead><tr><th>Running</th><th>From</th><th>State</th><th>Wait</th><th>Query</th></tr></thead><tbody>' +
        realActive.map(function (a) {
          return '<tr><td>' + (a.dur_s != null ? a.dur_s.toFixed(1) + 's' : '—') + '</td>' +
            '<td class="mono muted">' + esc(a.client || '—') + '</td>' +
            '<td>' + (a.blocked ? '<span style="color:var(--danger)">blocked</span>' : esc(a.state)) + '</td>' +
            '<td class="muted">' + esc(a.wait || '—') + '</td>' +
            '<td class="mono">' + esc((a.query || '').slice(0, 160)) + '</td></tr>';
        }).join('') + '</tbody></table>';
    } else {
      h += '<p class="muted" style="margin-top:12px">Nothing is running right now.</p>';
    }

    if (d.slow_history.length) {
      h += '<h4 style="margin:18px 0 8px">Slow queries (&gt; ' + (d.slow_query_ms / 1000) + 's)</h4>';
      h += '<p class="muted">Seen in the last minute of polling. Literals are collapsed, so 50 ' +
           'near-identical queries group into one row.</p>';
      h += '<table><thead><tr><th>Worst</th><th>Last</th><th>Wait</th><th>Query</th></tr></thead><tbody>' +
        d.slow_history.map(function (e) {
          return '<tr><td>' + e.max_s.toFixed(1) + 's</td><td>' + e.last_s.toFixed(1) + 's</td>' +
            '<td class="muted">' + esc(e.wait || '—') + '</td>' +
            '<td class="mono">' + esc(e.query.slice(0, 200)) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }

    // Persisted event log. Polling alone cannot catch a block that starts and
    // clears between two samples -- which is exactly the "it showed blocked then
    // vanished" case. The server keeps these, so they survive the event ending.
    if (d.events && d.events.length) {
      h += '<h4 style="margin:18px 0 8px">Event log</h4>';
      h += '<p class="muted">Kept after the fact, so a block that has already cleared is still here.</p>';
      h += '<table><thead><tr><th>When</th><th>What</th><th>Detail</th></tr></thead><tbody>' +
        d.events.map(function (e) {
          var color = e.severity === 'danger' ? 'var(--danger)' : 'var(--warn)';
          var detail = e.extra && e.extra.query ? '<div class="mono muted">' + esc(e.extra.query) + '</div>' : '';
          if (e.extra && e.extra.blocker) {
            detail += '<div class="mono" style="color:var(--danger)">blocked by: ' + esc(e.extra.blocker) + '</div>';
          }
          return '<tr><td class="muted">' + esc(String(e.at).slice(11, 19)) + '</td>' +
            '<td style="color:' + color + '">' + esc(e.message) + '</td>' +
            '<td>' + detail + '</td></tr>';
        }).join('') + '</tbody></table>';
    }

    $('queryWrap').innerHTML = h;
  }

  function showDeadlocks() {
    var body = $('dbDlgBody');
    body.innerHTML = '<p class="muted">Reading lock state…</p>';
    if (!$('dbDialog').open) $('dbDialog').showModal();
    api('/api/envadmin/db/deadlocks').then(function (d) {
      var h = '';

      h += '<p><strong>' + fmtNum(d.deadlocks_total) + ' deadlock' + (d.deadlocks_total === 1 ? '' : 's') +
           '</strong> since the counters were last reset' +
           (d.stats_reset ? ' (' + esc(String(d.stats_reset).slice(0, 19).replace('T', ' ')) + ' UTC).' : '.') +
           ' Postgres does not keep the details of a deadlock &mdash; only this count. ' +
           'Which two transactions collided exists solely in the server log, so a past ' +
           'deadlock cannot be reconstructed by any query.</p>';

      if (!d.can_diagnose_future) {
        h += '<p style="color:var(--warn)"><strong>log_lock_waits is off.</strong> The server is ' +
             'writing nothing when a session waits on a lock, so the next deadlock will be just as ' +
             'undiagnosable as this one. On RDS this needs the parameter group changed and the ' +
             'instance rebooted.</p>';
      } else {
        h += '<p style="color:var(--accent2)">log_lock_waits is on, so lock waits are being ' +
             'written to the log and the next deadlock will be diagnosable.</p>';
      }

      h += '<p class="muted">deadlock_timeout ' + d.deadlock_timeout_ms + 'ms &middot; ' +
           'lock_timeout ' + d.lock_timeout_ms + 'ms</p>';

      if (d.blocked_now && d.blocked_now.length) {
        h += '<h4 style="margin:16px 0 8px">Blocked right now (' + d.blocked_now.length + ')</h4>';
        h += '<table><thead><tr><th>PID</th><th>Wait</th><th>Held for</th><th>Waiting for</th><th>Query</th></tr></thead><tbody>' +
          d.blocked_now.map(function (b) {
            return '<tr><td class="mono">' + b.pid + '</td>' +
              '<td>' + esc((b.wait_event_type || '') + ' ' + (b.wait_event || '')) + '</td>' +
              '<td>' + (b.running_s != null ? Math.round(b.running_s) + 's' : '—') + '</td>' +
              '<td class="mono">' + esc(b.waiting_mode + (b.waiting_on ? ' on ' + b.waiting_on : '')) + '</td>' +
              '<td class="mono">' + esc((b.query || '').slice(0, 120)) + '</td></tr>';
          }).join('') + '</tbody></table>';
      } else {
        h += '<p class="muted" style="margin-top:16px">No sessions are blocked on a lock at this ' +
             'moment. A deadlock is by nature a transient event, so an empty list here does not ' +
             'mean they are not happening &mdash; it means none are in flight right now.</p>';
      }

      body.innerHTML = h;
    }).catch(function (e) {
      body.innerHTML = '<p style="color:var(--danger)">' + esc(e.message) + '</p>';
    });
  }

  function renderAllEnvs(projects) {
    var list = $('allEnvList');
    if (!projects.length) {
      list.innerHTML = '<div class="empty">No .env files found</div>';
      return;
    }
    list.innerHTML = projects.map(function (p) {
      var badge = p.comparable
        ? (p.needsRestart
            ? '<span class="badge warn">needs restart</span>'
            : '<span class="badge yes">deployed</span>')
        : '';
      var mtime = p.mtime ? new Date(p.mtime).toLocaleString() : '—';
      var rows = p.vars.map(function (v) {
        var dot = v.deployed == null
          ? ''
          : (v.deployed
              ? '<span class="dot ok" title="live in running process"></span>'
              : '<span class="dot" title="changed — restart to deploy"></span>');
        return '<div class="vrow" data-project="' + esc(p.name) + '" data-key="' + esc(v.key) + '">' +
          '<div class="key mono">' + dot + ' ' + esc(v.key) + '</div>' +
          '<div class="val" data-revealed="0" title="' + esc(v.value) + '">' + esc(maskValue(v.value)) + '</div>' +
          '<div class="actions">' +
          '<button data-act="toggle">' + (v.value.length <= 8 ? 'show' : 'reveal') + '</button>' +
          '<button data-act="copy">copy</button>' +
          '</div></div>';
      }).join('') || '<div class="empty">No variables</div>';
      return '<div class="project" data-name="' + esc(p.name) + '">' +
        '<div class="row"><div class="name">' + esc(p.name) + '</div>' + badge + '<div class="spacer"></div>' +
        '<button data-all="edit">Edit</button>' +
        '<button data-all="download">Download .env</button></div>' +
        '<div class="meta">' + esc(p.envPath || '') + ' · modified ' + esc(mtime) + '</div>' +
        rows +
        '</div>';
    }).join('');

    list.querySelectorAll('.vrow').forEach(function (row) {
      var pname = row.getAttribute('data-project');
      var key = row.getAttribute('data-key');
      var project = projects.find(function (x) { return x.name === pname; });
      var v = project && project.vars.find(function (x) { return x.key === key; });
      if (!v) return;
      var valEl = row.querySelector('.val');
      row.querySelector('[data-act="toggle"]').addEventListener('click', function () {
        var revealed = valEl.getAttribute('data-revealed') === '1';
        if (revealed) { valEl.textContent = maskValue(v.value); valEl.setAttribute('data-revealed', '0'); }
        else { valEl.textContent = v.value; valEl.setAttribute('data-revealed', '1'); }
      });
      row.querySelector('[data-act="copy"]').addEventListener('click', function () {
        (navigator.clipboard ? navigator.clipboard.writeText(v.value) : Promise.reject())
          .then(function () { toast('Copied ' + key, 'ok'); })
          .catch(function () {
            var ta = document.createElement('textarea');
            ta.value = v.value;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            toast('Copied ' + key, 'ok');
          });
      });
    });

    list.querySelectorAll('[data-all]').forEach(function (b) {
      var pn = b.closest('.project').getAttribute('data-name');
      var project = projects.find(function (x) { return x.name === pn; });
      if (!project) return;
      var act = b.getAttribute('data-all');
      b.addEventListener('click', function () {
        if (act === 'edit') {
          openProject(pn);
        } else if (act === 'download') {
          download(pn + '.env', project.raw);
          toast('Downloaded ' + pn + '.env', 'ok');
        }
      });
    });
  }

    }
    list.innerHTML = vars.map(function (v) {
      var dot = v.deployed == null
        ? ''
        : (v.deployed
            ? '<span class="dot ok" title="live in running process"></span>'
            : '<span class="dot" title="changed — restart to deploy"></span>');
      return '<div class="vrow" data-key="' + esc(v.key) + '">' +
        '<div class="key mono">' + dot + ' ' + esc(v.key) + '</div>' +

        '<div class="actions">' +
        '<button data-act="toggle">' + (v.value.length <= 8 ? 'show' : 'reveal') + '</button>' +
        '<button data-act="copy">copy</button>' +
        '<button data-act="edit">edit</button>' +
        '<button class="danger" data-act="del">del</button>' +
        '</div></div>';

    list.querySelectorAll('.vrow').forEach(function (row) {
      var key = row.getAttribute('data-key');
      var v = vars.find(function (x) { return x.key === key; });
      var valEl = row.querySelector('.val');

      row.querySelector('[data-act="toggle"]').addEventListener('click', function () {
        var revealed = valEl.getAttribute('data-revealed') === '1';
        if (revealed) { valEl.textContent = maskValue(v.value); valEl.setAttribute('data-revealed', '0'); }
        else { valEl.textContent = v.value; valEl.setAttribute('data-revealed', '1'); }
      });
      row.querySelector('[data-act="copy"]').addEventListener('click', function () {
        (navigator.clipboard ? navigator.clipboard.writeText(v.value) : Promise.reject())
          .then(function () { toast('Copied ' + key, 'ok'); })
          .catch(function () {
            var ta = document.createElement('textarea');
            ta.value = v.value;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            toast('Copied ' + key, 'ok');

          .then(function () { toast('Deleted ' + key, 'ok'); loadEnv(); refreshProjects(); })
          .catch(function (e) { toast(e.message, 'err'); });

  // ---- restart ------------------------------------------------------------
  var restarting = false;

  function restartBackend() {
    if (restarting) return;
    if (!confirm('Restart the backend now to deploy .env changes?\nThe API will be offline for a few seconds.')) return;
    restarting = true;
    var btn = $('restartBtn');
    btn.disabled = true;
    btn.textContent = 'Restarting…';
    var before = lastSystem && lastSystem.pm2 && lastSystem.pm2[0] ? lastSystem.pm2[0].restart_time : null;
    setStatus('restarting…', '');
    api('/api/envadmin/restart', { method: 'POST' })
      .catch(function () {})
      .then(function () { pollUntilBack(before); });
  }

  function pollUntilBack(before) {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      fetch((API_BASE || '') + '/api/health', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function () {
        api('/api/envadmin/system').then(function (s) {
          var rt = s.pm2 && s.pm2[0] ? s.pm2[0].restart_time : -1;
          if (before == null || rt > before) {
            clearInterval(timer);
            finishRestart(s, false);
          }
        }).catch(function () {});
      }).catch(function () {});
      if (tries >= 40) {
        clearInterval(timer);
        finishRestart(null, true);
      }
    }, 2000);
  }

  function finishRestart(s, timedOut) {
    restarting = false;
    var btn = $('restartBtn');
    btn.disabled = false;
    btn.textContent = 'Restart backend';
    if (allEnvActive) loadAllEnvs(); else loadProjects();
    loadDb();
    if (s) {
      lastSystem = s;
      renderSystem(s);
      setStatus('connected — ' + s.hostname, 'ok');
      toast(timedOut ? 'Backend is back but restart may have failed' : 'Backend restarted & .env redeployed', timedOut ? 'err' : 'ok');
    } else {
      setStatus('connected', 'ok');
      loadSystem();
      loadDb();
      toast('Backend is back online', 'ok');
    }
    if ($('envDialog').open) loadEnv();
  }

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  // ---- events -------------------------------------------------------------
  $('exportBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    var m = $('exportMenu');
    m.style.display = m.style.display === 'none' ? 'block' : 'none';
  });
  document.addEventListener('click', function () { $('exportMenu').style.display = 'none'; });
  $('exportMenu').addEventListener('click', function (e) {
    var act = e.target.getAttribute('data-export');

      if (!lastEnvData || lastEnvData.raw == null) { toast('Env not loaded yet', 'err'); return; }
      download(currentProject + '.env', lastEnvData.raw);
      toast('Downloaded ' + currentProject + '.env', 'ok');
    } else if (act === 'json') {
      if (!lastEnvData) { toast('Env not loaded yet', 'err'); return; }
      var payload = {
        project: currentProject,
        envPath: lastEnvData.envPath,
        exportedAt: new Date().toISOString(),
        vars: currentVars,
      };
      download(currentProject + '-env.json', JSON.stringify(payload, null, 2), 'application/json');
      toast('Downloaded ' + currentProject + '-env.json', 'ok');
    }

  $('addForm').addEventListener('submit', function (ev) {
    ev.preventDefault();

    var value = $('newValue').value;

    api('/api/envadmin/projects/' + encodeURIComponent(currentProject) + '/env', {
      method: 'POST',

    }).then(function () {

      refreshProjects();

  $('newKey').addEventListener('input', updateAddBtn);

  $('refreshBtn').addEventListener('click', function () {
    loadSystem();
    if (allEnvActive) loadAllEnvs(); else loadProjects();
  });

  $('viewAllBtn').addEventListener('click', toggleAllEnv);

  $('downloadAllBtn').addEventListener('click', function () {
    if (!lastAllData || !lastAllData.projects || !lastAllData.projects.length) {
      toast('Nothing loaded yet', 'err');
      return;
    }
    var text = lastAllData.projects.map(function (p) {
      return '# === ' + p.name + ' (' + p.envPath + ') ===\n' + (p.raw || '');
    }).join('\n\n');
    download('all-env.txt', text);
    toast('Downloaded all .env files', 'ok');
  });

  $('restartBtn').addEventListener('click', restartBackend);

  $('dlgClose').addEventListener('click', function () { $('envDialog').close(); });

  $('tokenBtn').addEventListener('click', function () {
    var t = prompt('Current token: ' + (TOKEN ? TOKEN : '(none)') + '\n\nEnter new admin token (leave empty to clear):');
    if (t === null) return;
    TOKEN = t.trim();
    try { localStorage.setItem('envAdminToken', TOKEN); } catch (e) {}
    toast('Token saved', 'ok');
  });

  $('dbDlgClose').addEventListener('click', function () { $('dbDialog').close(); });

  // ---- init ---------------------------------------------------------------
  loadSystem();
  loadProjects();
  loadDb();
  loadQueries();
  loadClients();
  setInterval(loadSystem, 15000);
  // The /db call sleeps 1s server-side to sample a rate, so poll it less often
  // than the host stats -- every call holds a pool connection for that second.
  setInterval(loadDb, 20000);
  // Queries poll fastest: this is the live view, and a spike that lasts 10
  // seconds is exactly what you are trying to catch.
  // Queries poll every 10s, not 5s. Each poll runs several pg_stat_activity
  // scans, so a 5s cadence made the panel a visible share of the database load
  // it was trying to measure -- and a blocked event shorter than the interval was
  // still invisible. The server-side event log, not this cadence, is what
  // catches brief blocks.
  setInterval(loadQueries, 10000);
  setInterval(loadClients, 20000);
})();
</script>
</body>
</html>
